<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITLE HERE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#f4eee2;--panel:#fdf9f1;--ink:#2a2521;--muted:#6a6157;--faint:#978d82;
    --line:#e3d9c7;--accent:#b0523a;--soft:#f5e4dc;--warn:#7a5a1e;--warnsoft:#f3ead3;

    --r:10px;--r2:14px}
  :root{color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --bg:#1b1916;--panel:#242019;--ink:#ede4d6;--muted:#a89e8f;--faint:#766d60;
    --line:#38322a;--accent:#e28f72;--soft:#3b2a24;--warn:#dcb66e;--warnsoft:#302a1c;
    --quote:#2a2620}}
  :root[data-theme="dark"]{color-scheme:dark;
    --bg:#1b1916;--panel:#242019;--ink:#ede4d6;--muted:#a89e8f;--faint:#766d60;
    --line:#38322a;--accent:#e28f72;--soft:#3b2a24;--warn:#dcb66e;--warnsoft:#302a1c;
    --quote:#2a2620}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:18px/1.7 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  h1,h2,h3{letter-spacing:-.015em}
  header{position:sticky;top:0;z-index:60;background:var(--panel);
    border-bottom:1px solid var(--line);padding:var(--s4) var(--s6);
    display:flex;align-items:center;gap:var(--s5)}
  header h1{font-size:15px;margin:0;font-weight:650}
  .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
    background:var(--soft);padding:3px var(--s2);border-radius:var(--s1);font-weight:650}
  .spacer{flex:1}.count{font-size:13px;color:var(--muted)}
  button.theme{background:var(--bg);border:1px solid var(--line);color:var(--muted);font:inherit;
    font-size:12px;padding:4px var(--s3);border-radius:var(--s2);cursor:pointer}
  button.theme:hover{color:var(--accent);border-color:var(--accent)}
  button.theme.danger:hover{color:var(--warn);border-color:var(--warn)}
  .discardask{display:flex;gap:var(--s2);align-items:center;font-size:12.5px;color:var(--warn)}
  .discardask[hidden],button.theme[hidden]{display:none}

    border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .discardask button.yes{background:var(--warn);border-color:var(--warn);color:var(--panel)}
  .discarded{max-width:520px;margin:18vh auto;padding:0 var(--s5);text-align:center;color:var(--muted)}
  .discarded h1{color:var(--ink);font-size:22px}
  .layout{display:grid;grid-template-columns:var(--tocw,206px) minmax(0,1fr) var(--chatw,350px);gap:var(--s7);
    max-width:1400px;margin:0 auto;padding:var(--s6) var(--s6) 140px;position:relative}
  /* Column grips (user, 2026-10-06: "decrease and increase width"): drag the gap beside the contents
     or the chat; double-click resets. Widths are per viewer, in localStorage. */
  .colgrip{position:absolute;top:0;bottom:0;width:14px;cursor:col-resize;z-index:4;touch-action:none}
  .colgrip::after{content:"";position:sticky;top:30vh;display:block;margin:0 auto;width:4px;height:44px;border-radius:2px;
    background:var(--line);opacity:0;transition:opacity .15s}
  .colgrip:hover::after,.colgrip.drag::after{opacity:1;background:var(--accent)}
  html.colresize,html.colresize *{cursor:col-resize!important;user-select:none!important}
  @media(max-width:1200px){.layout{grid-template-columns:var(--tocw,186px) minmax(0,1fr)}
    /* narrow: the conversation slides in from the right instead of disappearing */
    aside.right{position:fixed;top:0;right:0;bottom:0;max-height:none;width:min(380px,92vw);z-index:110;overflow-y:auto;
      border-radius:0;transform:translateX(105%);transition:transform .2s;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
    aside.right.open{transform:none} #cpfab{display:flex!important}
    html.embedded aside.right{top:0;max-height:none}}
  #cpfab{display:none;position:fixed;right:16px;bottom:16px;z-index:111;align-items:center;gap:6px;border:0;

    cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #cpfab em{font-style:normal;background:#fff;color:var(--accent);border-radius:999px;padding:0 7px;font-size:11.5px}
  @media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}nav.toc{display:none}}
  nav.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 110px);
    overflow-y:auto;font-size:13px}
  nav.toc .grp{color:var(--faint);text-transform:uppercase;letter-spacing:.07em;

  nav.toc .grp:first-child{margin-top:0}

  nav.toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--soft);font-weight:600}

  .num{color:var(--faint);font-weight:600;font-size:14px;margin-right:var(--s2)}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 var(--s5)}
  blockquote{margin:var(--s3) 0;padding:var(--s3) var(--s5);background:var(--quote);
    border-left:2px solid var(--line);border-radius:0 var(--s2) var(--s2) 0;font-size:13.5px}
  .plain{background:var(--soft);border-left:3px solid var(--accent);padding:var(--s3) var(--s5);
    border-radius:0 var(--s2) var(--s2) 0;margin:var(--s4) 0;font-size:13.5px}
  .plain b{color:var(--accent)}
  .risk{background:var(--warnsoft);border-left:3px solid var(--warn);padding:var(--s3) var(--s5);
    border-radius:0 var(--s2) var(--s2) 0;margin:var(--s4) 0;font-size:13.5px}
  .risk b{color:var(--warn)}
  .cbtn{position:absolute;top:var(--s5);right:var(--s5);opacity:0;transition:opacity .15s;
    background:var(--bg);border:1px solid var(--line);color:var(--muted);font:inherit;
    font-size:12px;padding:4px var(--s3);border-radius:var(--s2);cursor:pointer}
  .cbtn:hover{color:var(--accent);border-color:var(--accent)}
  .cbtn.has{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--soft)}
  .d{border:1px solid var(--line);border-radius:var(--r);padding:var(--s5) 18px;
    margin:var(--s5) 0;position:relative}
  .d:hover .cbtn{opacity:1}
  .d.open{border-left:3px solid var(--accent)}
  .q{font-weight:650;font-size:14.5px;margin-bottom:3px}
  .why{color:var(--muted);font-size:13px;margin-bottom:var(--s4)}
  label.opt{display:flex;gap:var(--s3);align-items:flex-start;padding:9px var(--s4);
    border:1px solid transparent;border-radius:var(--s2);cursor:pointer;font-size:14px}
  label.opt:hover{background:var(--bg)}
  label.opt.sel{border-color:var(--accent);background:var(--soft)}
  label.opt input{margin-top:3px;accent-color:var(--accent);flex:none}
  .oh{font-weight:550}.od{color:var(--muted);font-size:12.5px;display:block;margin-top:1px}
  .mm{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;margin:var(--s4) 0;overflow-x:auto;text-align:center}
  table.t{width:100%;border-collapse:collapse;font-size:13px;margin:var(--s4) 0}
  table.t th,table.t td{border:1px solid var(--line);padding:var(--s2) var(--s3);
    text-align:left;vertical-align:top}
  table.t th{background:var(--bg);font-weight:650}
  code{background:var(--quote);padding:1px 5px;border-radius:5px;font-size:12.5px}
  pre.code{background:var(--quote);padding:var(--s5);border-radius:var(--r);
    overflow-x:auto;font-size:12.5px;margin:var(--s4) 0}
  details.ref{border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) 18px;
    margin:var(--s4) 0;background:var(--bg)}
  details.ref summary{cursor:pointer;font-weight:650;font-size:14px;color:var(--accent)}
  /* The Chat center (the right column): decisions in brief, Send, then the page's conversation.
     Pinned at full window height with its own scroll, so the page and the chat scroll separately. */
  aside.right{position:sticky;top:78px;align-self:start;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r2);padding:var(--s5) 18px;max-height:calc(100vh - 92px);overflow-y:auto;overscroll-behavior:contain}
  aside.right h2{font-size:15px;margin:0}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .dsum{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px}
  .dsum a{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer}
  #dchg{font-size:12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:6px;
    padding:5px 9px;margin-top:8px} #dchg:empty{display:none} #dchg b{font-size:10.5px;letter-spacing:.05em}
  .dlist{margin:var(--s3) -4px 0;padding:0 4px;border-top:1px dashed var(--line)} .dlist[hidden]{display:none}
  .dr{display:flex;gap:9px;align-items:center;padding:5px var(--s2);border-radius:var(--s1);
    cursor:pointer;font-size:12.5px}
  .dr:hover{background:var(--bg)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
  .dr.done .dot{background:var(--accent)}
  .dn{color:var(--muted);font-weight:700;flex:none}
  .dr.todo .dv{color:var(--muted);font-style:italic}
  .topact{position:sticky;top:calc(-1 * var(--s5));z-index:5;background:var(--panel);padding:12px 0 8px;margin-top:6px;
    display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
  .sendto{font-size:11.5px;color:var(--muted);text-align:center} .sendto b{color:var(--ink)}
  .sendto select{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 4px}
  .sendto.busy b{color:var(--accent)}
  .wstat{font-size:12px;text-align:center;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
  .wstat:empty{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wstat .spin{width:11px;height:11px;border:2px solid var(--warn);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
  .wstat.working{color:var(--warn)} .wstat.ready{color:var(--accent)} .wstat.stale{color:var(--muted)}
  .wstat button{font:inherit;font-size:11.5px;border:0;border-radius:7px;background:var(--accent);color:#fff;padding:2px 9px;cursor:pointer}
  .pagec{font:inherit;font-size:12.5px;border:1px dashed var(--line);background:none;color:var(--muted);
    border-radius:10px;padding:6px;cursor:pointer} .pagec:hover{color:var(--accent);border-color:var(--accent)}
  #queue{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  /* Progress meter (user, 2026-09-28): what Claude is working on, answered recently, or all caught up. */
  .cprog{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12.5px;background:var(--bg)}
  .cprog:empty{display:none}
  .cprog .l{display:flex;gap:7px;align-items:center}
  .cprog .spin{width:11px;height:11px;border:2px solid var(--warn);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
  .cprog.working{border-color:var(--warn)} .cprog.working .l{color:var(--warn);font-weight:700}
  .cprog .pb{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
  .cprog .pb i{display:block;height:100%;background:var(--warn);transition:width .4s}
  .cprog .sub{margin-top:5px;color:var(--muted);font-size:11.5px}
  .cprog.recent{border-color:var(--accent);background:var(--soft)} .cprog.recent .l{color:var(--accent);font-weight:700}
  .cprog.idle{color:var(--muted)}
  .th.unread{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .th .ndot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  /* The recommended option's tag (SKILL: "a small tag on the option"). */
  .rec{display:inline-block;font:700 10.5px ui-monospace,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;margin-left:6px;border-radius:999px;background:#C8FF3D;color:#141414;border:1px solid #141414;vertical-align:middle}
  .sect{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
  .th{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:9px 10px;font-size:13px}
  .th .hd{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:4px}
  .th .hd .where{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .th .hd .st{margin-left:0;white-space:nowrap}
  .th .hd a{color:var(--accent);cursor:pointer}
  .ktag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;text-transform:uppercase;letter-spacing:.03em}
  .ktag.question{background:color-mix(in srgb,#3b82f6 16%,transparent);color:#3b82f6}
  .ktag.change{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .ktag.note{background:color-mix(in srgb,#22a55a 16%,transparent);color:#22a55a}
  .th .st{margin-left:auto;font-weight:700} .st.ok{color:#22a55a} .st.wait{color:var(--accent)} .st.queued{color:var(--muted)}
  .st.work{color:#3b82f6} .st.call{color:var(--warn)}
  .th .msg{margin-top:7px;padding:7px 9px;border-radius:9px;line-height:1.5}
  .th .msg.claude{background:var(--soft)} .th .msg.you{border:1px solid var(--line);margin-left:16px}
  .th .msg .who{display:block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
  .th .msg.claude .who{color:var(--accent)} .th .msg.you .who{color:var(--muted)}
  .th .msg code{background:var(--bg);padding:0 4px;border-radius:4px;font-size:12px}
  .th .msg ul{margin:4px 0 0 16px;padding:0}
  .th .act{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .th .act button,.th .rb button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:8px;padding:3px 9px;cursor:pointer}
  .th .act button.pri,.th .rb button{background:var(--accent);border-color:var(--accent);color:#fff}
  .th .rb{display:flex;gap:6px;margin-top:8px}
  .th .rb{align-items:flex-end}
  .th .rb textarea{flex:1;min-width:0;font:inherit;font-size:12.5px;line-height:1.4;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--ink);padding:5px 8px;resize:none;max-height:160px;overflow-y:auto}
  .th .earlier{font-size:11.5px;color:var(--accent);cursor:pointer;margin-top:6px}
  .th .older{display:none} .th .older.on{display:block}
  .th .typing{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}
  .th.fold{padding:6px 10px;cursor:pointer} .th.fold:hover{border-color:var(--accent)}
  .th.fold .body{display:none}
  .th .row1{display:flex;gap:7px;align-items:center}
  .th .row1 .q1{flex:1;min-width:0}
  .th.fold .row1 .q1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .th .n{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .th .wide{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}
  #wideview{display:none;position:fixed;inset:6vh 10vw;z-index:120;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r2);padding:20px 24px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  #wideview.on{display:block} #wideview .th{font-size:14px} #wideview .x{float:right;cursor:pointer;border:0;background:none;font-size:18px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:var(--s5) var(--s3)}
  /* Inside the App Maker the page's own header is hidden — the App Maker shows the round and the counts. */
  html.embedded header{display:none}
  html.embedded nav.toc{top:12px} html.embedded aside.right{top:12px;max-height:calc(100vh - 24px)}
  html.embedded section{scroll-margin-top:16px}
  button.primary{width:100%;background:var(--accent);color:#fff;border:0;padding:11px;
    border-radius:var(--r);font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
  button.primary:disabled{background:var(--bg);color:var(--faint);border:1px solid var(--line);cursor:default}
  #pop{position:absolute;z-index:100;width:328px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);
    box-shadow:0 10px 34px rgba(0,0,0,.18);display:none}
  #pop .pa{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;

  #pop .kind{display:flex;gap:var(--s2);margin-bottom:var(--s2)}
  #pop .pophint{font-size:11px;color:var(--faint);margin:3px 0 0}
  #pop .kind label{flex:1;display:flex;gap:6px;align-items:center;font-size:12.5px;
    padding:5px var(--s2);border:1px solid var(--line);border-radius:var(--s2);cursor:pointer;color:var(--muted)}

  #pop button.add{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:650}
  /* "Claude is working" strip: shown after a round is sent, until the page is revised */

<!-- optional: <script src="vendor/mermaid.min.js"></script> for <pre class="mermaid"> diagrams -->
<script>
const S={decisions:{},comments:[],batches:[]}; let ROUND=1;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1700)};
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b)}).then(r=>r.json());
const D=k=>S.decisions[k];
function groups(){return [...document.querySelectorAll('[data-radio],[data-check]')]}

function buildChanged(){
  // Blocks the author marked data-changed="N" (N = the round they were revised in).
  // The rail lists the latest round's blocks so the reviewer can find what moved.
  const els=[...document.querySelectorAll('[data-changed]')]; if(!els.length) return;
  const latest=Math.max(...els.map(e=>+e.dataset.changed));
  const mine=els.filter(e=>+e.dataset.changed===latest);
  $('#toc').insertAdjacentHTML('afterbegin',`<div class="chg"><div class="grp">Changed in round ${latest} (${mine.length})</div>`+
    mine.map((e,i)=>{ if(!e.id) e.id='chg-'+latest+'-'+i;
      return `<a href="#${e.id}" data-id="${e.id}">${esc(e.dataset.label||e.dataset.title||e.id)}</a>`}).join('')+
    `<div class="grp" style="margin-top:10px">Contents</div></div>`);
  document.querySelectorAll('#toc .chg a').forEach(a=>a.onclick=ev=>{ev.preventDefault();
    const el=document.getElementById(a.dataset.id); el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash')});
}
function buildToc(){
  let last='';
  $('#toc').innerHTML=[...document.querySelectorAll('main section')].map(s=>{
    let out=''; if(s.dataset.group!==last){out+=`<div class="grp">${s.dataset.group}</div>`;last=s.dataset.group}
    return out+`<a href="#${s.id}" data-id="${s.id}">${s.dataset.title}</a>`}).join('');
  const links=[...document.querySelectorAll('#toc a')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting)
    links.forEach(l=>l.classList.toggle('on',l.dataset.id===e.target.id)) }),
    {rootMargin:'-84px 0px -70% 0px'});
  document.querySelectorAll('main section').forEach(s=>io.observe(s));
}
function renderDecisions(){
  const gs=groups(); let done=0;
  const label=(id)=>{const g=gs.find(x=>(x.dataset.radio||x.dataset.check)===id);if(!g)return null;
    const ch=[...g.querySelectorAll('input:checked')];return ch.map(i=>i.closest('label').querySelector('.oh').textContent).join(', ')};
  $('#dlist').innerHTML=gs.map(g=>{
    const id=g.dataset.radio||g.dataset.check, blk=g.closest('.d');
    const ch=[...g.querySelectorAll('input:checked')]; if(ch.length) done++;
    const val=ch.map(i=>i.closest('label').querySelector('.oh').textContent).join(', ');
    return `<div class="dr ${ch.length?'done':'todo'}" data-goto="${blk?blk.dataset.anchor:''}">
      <span class="dot"></span><span class="dn">${id.toUpperCase()}</span>
      <span class="dv">${esc(val||'not decided')}</span></div>`}).join('');
  $('#dprog').innerHTML=gs.length?(done===gs.length?`<b style="color:#22a55a">✓ ${done} of ${gs.length} decided</b>`:`${done} of ${gs.length} decided`):'No decisions on this page';
  $('#dtoggle').style.display=gs.length?'':'none';
  $('#dbar').style.width=(gs.length?done/gs.length*100:0)+'%';
  // what changed since the last round was sent
  // Same rule as Send: compare with the last round (or the baseline before any round); an empty choice is no choice.
  const last=(S.batches[S.batches.length-1]||{}).decisions||S.base||{};
  const v=x=>Array.isArray(x)?(x.length?JSON.stringify([...x].sort()):null):(x??null);
  const chg=gs.map(g=>g.dataset.radio||g.dataset.check).filter(id=>v(S.decisions[id])!==v(last[id])&&v(S.decisions[id])!==null);
  $('#dchg').innerHTML=chg.length?`<b>CHANGED SINCE LAST ROUND:</b> `+chg.map(id=>`${id.toUpperCase()} → ${esc(label(id)||'')}`).join(' · '):'';
  $('#dcount').textContent=`${done}/${gs.length} decided · ${S.comments.filter(c=>c.status==='queued').length} queued`;
  document.querySelectorAll('.dr').forEach(r=>r.onclick=()=>{
    const el=document.querySelector(`[data-anchor="${r.dataset.goto}"]`); if(!el)return;
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash')});
  report();
}
// "General comment": the same popup, not pinned to a block
$('#pagec').onclick=e=>{e.stopPropagation();target={anchor:'page',label:'General',text:''};
  const p=$('#pop'),r=$('#pagec').getBoundingClientRect();$('#popanchor').textContent='General — not about one block';$('#poptext').value='';setKind('question');
  p.style.display='block';p.style.top=(window.scrollY+r.bottom+8)+'px';p.style.left=Math.max(12,r.right-328+window.scrollX)+'px';$('#poptext').focus()};
$('#cpfab').onclick=()=>$('aside.right').classList.toggle('open');
$('#dtoggle').onclick=()=>{const l=$('#dlist');l.hidden=!l.hidden;$('#dtoggle').textContent=l.hidden?'show all':'hide'};
// ---- The page's conversation: every comment is a small thread; answers come back here, not to the terminal ----
let AGENT={agent:null,status:null}, openIds=new Set();
// Links: any http(s) URL is clickable (user, 2026-09-28); a full stop or bracket after it stays outside the link.
const md=t=>esc(t).replace(/https?:\/\/[^\s<]+?(?=[.,;:!?)\]]*(?:\s|<|&quot;|&lt;|&gt;|$))/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/(^|\n)- (.+)/g,'$1<li>$2</li>').replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>').replace(/\n/g,'<br>');
const KL={question:'Question',change:'Change',note:'Note'};
const ago=t=>{if(!t)return'';const s=(Date.now()-new Date(t))/1000;return s<60?'now':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':new Date(t).toLocaleDateString()};
// Statuses (user, 2026-10-08): queued → sent → working → done. "Your call" = Claude suggested something.
function stateOf(c){const m=c.messages||[], last=m[m.length-1];
  if(c.status==='queued')return['queued','queued'];
  if(c.suggest)return['call','your call'];
  if(last&&last.from==='claude')return['ok','✓ done'];
  if(c.addressed)return['ok','✓ done'];
  if(c.working)return['work','working'];
  return['wait',AGENT.status==='working'?'sent · Claude is busy, you\'re next':'sent']}
function waiting(c){const [cls]=stateOf(c);return cls!=='ok'}
function item(c,wide){
  const [cls,txt]=stateOf(c), m=c.messages||[], where=c.anchor==='page'?'general':`on <a data-goto="${esc(c.anchor)}">${esc(c.anchorLabel||c.anchor)}</a>`;
  const fold=!wide&&!waiting(c)&&!openIds.has(c.id);
  const kind=c.kind||'change';
  const mm=x=>`<div class="msg ${x.from==='claude'?'claude':'you'}"><span class="who">${x.from==='claude'?'Claude':'You'} · ${ago(x.t)}</span>${md(x.text||'')}</div>`;
  const older=(!wide&&m.length>1)?m.slice(0,-1):[], shown=(!wide&&m.length>1)?m.slice(-1):m;
  const body=`<div class="body">`+(older.length?`<div class="earlier" data-earlier="${c.id}">▸ ${older.length} earlier message${older.length>1?'s':''}</div><div class="older">${older.map(mm).join('')}</div>`:'')+shown.map(mm).join('')+
    (c.status==='queued'?`<div class="act"><button data-del="${c.id}">Delete</button></div>`:
     (c.suggest?`<div class="act"><button class="pri" data-mkchange="${c.id}">Make it a change request</button><button data-nothanks="${c.id}">No thanks</button></div>`:'')+
     (!m.length||m[m.length-1].from!=='you'?'':'<div class="typing">'+(AGENT.status==='working'?'Claude is busy — your message is next.':'Claude is answering…')+'</div>')+
     `<div class="rb"><textarea data-rin="${c.id}" rows="1" placeholder="Reply…"></textarea><button data-rsend="${c.id}">Reply</button></div>`)+`</div>`;
  const un=isUnread(c);
  return `<div class="th ${fold?'fold':''}${un?' unread':''}" data-th="${c.id}"><div class="hd">${un?'<span class="ndot" title="New answer"></span>':''}<span class="ktag ${kind}">${KL[kind]||'Change'}</span><span class="where" title="${esc(c.anchorLabel||'')}">${where}</span>
      <span class="st ${cls}">${txt}${m.length>1?` · ${m.length+1} msgs`:''}</span>${wide?'':`<button class="wide" data-wide="${c.id}" title="Open wide">⤢</button>`}</div>
    <div class="row1"><span class="q1">${fold?esc(c.text):md(c.text||'')}</span></div>${body}</div>`}
// ---- Progress meter + unread answers (user, 2026-09-28) ----
// Unread: a thread whose latest message is Claude's and newer than when this viewer last opened it.
// "Answered recently" stays until the viewer opens any one unread answer. Per viewer, in localStorage.
const PK='cprog:'+location.pathname;
function pget(){try{return JSON.parse(localStorage.getItem(PK)||'null')}catch(e){return null}}
function pset(v){try{localStorage.setItem(PK,JSON.stringify(v))}catch(e){}}
const lastClaude=c=>{const m=(c.messages||[]).filter(x=>x.from==='claude');return m.length?m[m.length-1].t:null};
function progInit(){if(pget())return;const seen={};S.comments.forEach(c=>{const t=lastClaude(c);if(t)seen[c.id]=t});pset({seen,dismissed:new Date().toISOString(),wave:null})}
function isUnread(c){const p=pget()||{seen:{}},t=lastClaude(c);if(!t)return false;const m=c.messages||[];
  return m[m.length-1].from==='claude'&&(!p.seen[c.id]||p.seen[c.id]<t)}
function markRead(id){const c=S.comments.find(x=>x.id===id);if(!c)return;const p=pget()||{seen:{}};const t=lastClaude(c);
  if(t&&isUnread(c)){p.seen[c.id]=t;p.dismissed=new Date().toISOString();pset(p)}}
function workingRound(){try{return JSON.parse(localStorage.getItem(WK)||'null')}catch(e){return null}}
function changedDecisions(round){const b=(S.batches||[])[round-1];if(!b)return 0;const prev=((S.batches||[])[round-2]||{}).decisions||{};
  const cur=b.decisions||{};return Object.keys(cur).filter(k=>JSON.stringify(cur[k])!==JSON.stringify(prev[k])).length}
let PLOADED=false;   // the page state has loaded — until then there's nothing true to show (and nothing to reset)
function renderProgress(){const box=$('#cprog');if(!box||!PLOADED)return;progInit();const p=pget();
  const pend=S.comments.filter(c=>['wait','work'].includes(stateOf(c)[0]));
  const n={question:0,note:0,change:0};pend.forEach(c=>{n[c.kind||'change']=(n[c.kind||'change']||0)+1});
  const wr=workingRound(), nd=wr?changedDecisions(wr.round):0;
  const busy=pend.length+nd;
  if(busy&&!p.wave){p.wave={start:new Date().toISOString()};pset(p)}
  if(!busy&&p.wave){p.wave=null;pset(p)}
  const unread=S.comments.filter(isUnread);
  const pl=(k,w)=>k?`${k} ${w}${k===1?'':'s'}`:'';
  if(busy){const done=S.comments.filter(c=>!pend.includes(c)&&lastClaude(c)&&lastClaude(c)>=p.wave.start).length;
    const parts=[pl(n.question,'question'),pl(n.note,'comment'),pl(n.change,'change'),pl(nd,'decision')].filter(Boolean).join(' · ');
    const pct=Math.round(100*done/Math.max(1,done+pend.length+(nd?1:0)));
    box.className='cprog working';
    box.innerHTML=`<div class="l"><span class="spin"></span>Working on ${parts}</div><div class="pb"><i style="width:${Math.max(6,pct)}%"></i></div>`+
      `<div class="sub">${done?`${done} answered so far`:(AGENT.status==='working'?'Claude is busy — yours are next':'Claude will pick these up shortly')}${unread.length?` · ${unread.length} new answer${unread.length>1?'s':''} below`:''}</div>`;return}
  const fresh=unread.filter(c=>lastClaude(c)>(p.dismissed||''));
  if(fresh.length){box.className='cprog recent';
    box.innerHTML=`<div class="l">✓ Answered recently — check the answers below</div><div class="sub">${fresh.length} new answer${fresh.length>1?'s':''} · marked with a dot</div>`;return}
  box.className='cprog idle';box.innerHTML=S.comments.length?'<div class="l">✓ All caught up</div>':''}
// "Goes to" options, under one heading per herdr workspace when the server sends groups
// (user, 2026-10-16: "group them in herdr workspaces so easier for me to select"); flat otherwise.
function gotoOptions(ss,cur){
  const opt=x=>`<option value="${esc(x.id)}"${x.id===cur?' selected':''}>${esc(x.name)}${x.status&&x.status!=='not running'?' — '+esc(x.status):''}</option>`;
  if(!ss.some(x=>x.group))return ss.map(opt).join('');
  const groups=[];ss.forEach(x=>{let g=groups.find(g=>g.name===(x.group||''));if(!g)groups.push(g={name:x.group||'',items:[]});g.items.push(x)});
  return groups.map(g=>`<optgroup label="${esc(g.name)}">${g.items.map(opt).join('')}</optgroup>`).join('')}
function renderQueue(){
  const q=S.comments.filter(c=>c.status==='queued');
  const nd=Object.keys(S.decisions).length;
  // Send says exactly what it will send (user, 2026-09-30: "Send 1 decision, 2 comments, 4 changes",
  // and "Nothing to send" when the user hasn't done anything). An empty choice counts as no choice.
  const val=v=>Array.isArray(v)?(v.length?JSON.stringify([...v].sort()):null):(v??null);
  const lastDec=(S.batches[S.batches.length-1]||{}).decisions||S.base||{};
  const nDec=[...new Set([...Object.keys(S.decisions),...Object.keys(lastDec)])].filter(k=>val(S.decisions[k])!==val(lastDec[k])).length;
  const nNote=q.filter(c=>c.kind==='note').length, nChg=q.length-nNote;
  const pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
  const parts=[nDec&&pl(nDec,'decision'),nNote&&pl(nNote,'comment'),nChg&&pl(nChg,'change')].filter(Boolean);
  $('#send').disabled=!parts.length;
  $('#send').textContent=parts.length?'Send '+parts.join(', '):'Nothing to send';
  // "Goes to" (user, 2026-10-08): with several Claude sessions, pick which one owns this page; Send and questions go there
  const st=$('#sendto'); if(!(st.querySelector('select')&&document.activeElement===st.querySelector('select')))
  st.innerHTML=(AGENT.sessions&&AGENT.sessions.length>1)
    ?`Goes to <select id="goto">${gotoOptions(AGENT.sessions,AGENT.session)}</select>`
    :(AGENT.agent?`→ <b>${esc(AGENT.agent)}</b>${AGENT.status?` · ${esc(AGENT.status)}`:''}`:'→ the Claude session in the terminal');
  const gs=st.querySelector('#goto'); if(gs)gs.onchange=async()=>{await post('/api/owner',{session:gs.value});
    try{AGENT=await fetch('/api/agent',{cache:'no-store'}).then(r=>r.json())}catch(e){} renderQueue(); toast('This page now goes to '+gs.selectedOptions[0].text)};
  $('#sendto').className='sendto'+(AGENT.status==='working'?' busy':'');
  const all=[...S.comments].reverse(), wait=all.filter(waiting), done=all.filter(c=>!waiting(c));
  renderWide();
  const ae=document.activeElement;
  if(ae&&ae.dataset&&ae.dataset.rin&&!ae.closest('#wideview')){renderProgress();return}   // don't redraw under a reply being typed
  $('#queue').innerHTML=(all.length?'':'<div class="empty">No messages yet.<br>Hover any block and press <em>comment</em> to ask, suggest a change or leave a note.</div>')+
    // one section per status, so a comment shows in exactly one place
    [['queued','Queued — not sent'],['wait','Sent'],['work','Working'],['call','Your call']].map(([k,h])=>{
      const xs=wait.filter(c=>stateOf(c)[0]===k); return xs.length?`<div class="sect">${h}</div>`+xs.map(c=>item(c)).join(''):''}).join('')+
    (done.length?'<div class="sect">Done — click to open</div>'+done.map(c=>item(c)).join(''):'');
  wireThread($('#queue'));
  const nw=wait.length; $('#cpfab').innerHTML='💬 Chat center'+(nw?` <em>${nw}</em>`:'');
  renderProgress();
  report();
}
function wireThread(root){
  root.querySelectorAll('[data-th]').forEach(el=>el.onclick=e=>{if(e.target.closest('button,input,a'))return;
    const id=el.dataset.th; markRead(id); if(el.classList.contains('fold')){openIds.add(id)}else if(!waiting(S.comments.find(c=>c.id===id)||{})){openIds.delete(id)} renderQueue()});
  root.querySelectorAll('[data-goto]').forEach(a=>a.onclick=()=>{const el=document.querySelector(`[data-anchor="${a.dataset.goto}"]`);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}});
  root.querySelectorAll('[data-earlier]').forEach(e=>e.onclick=()=>{const o=e.nextElementSibling;o.classList.toggle('on');
    e.textContent=o.classList.contains('on')?'▾ hide earlier messages':`▸ ${o.children.length} earlier message${o.children.length>1?'s':''}`});
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const r=await post('/api/comment/delete',{id:b.dataset.del});
    S.comments=r.comments;renderQueue();markAnchors();renderDecisions()});
  root.querySelectorAll('[data-rsend]').forEach(b=>{const id=b.dataset.rsend, inp=root.querySelector(`[data-rin="${id}"]`);
    const go=async()=>{const t=inp.value.trim();if(!t||b.disabled)return;b.disabled=true;inp.disabled=true;
      try{const r=await post('/api/reply',{id,text:t});if(r.comments)S.comments=r.comments;
        if(DRAFT[id]!=null)delete DRAFT[id];inp.value='';openIds.add(id);toast(AGENT.agent?'Sent to '+AGENT.agent:'Sent')}
      finally{b.disabled=false;inp.disabled=false;inp.blur();renderQueue();refreshSoon()}};
    const grow=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px'};
    inp.oninput=()=>{DRAFT[id]=inp.value;grow()}; if(inp.value)grow();
    b.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();go()}}});
  root.querySelectorAll('[data-mkchange]').forEach(b=>b.onclick=async()=>{const c=S.comments.find(x=>x.id===b.dataset.mkchange);
    const m=c.messages||[], ans=[...m].reverse().find(x=>x.from==='claude');
    await post('/api/comment',{id:'c'+Date.now(),anchor:c.anchor,anchorLabel:c.anchorLabel,anchorText:c.anchorText||'',kind:'change',
      text:`From the conversation “${c.text}”: ${ans?ans.text:''}`});
    const r=await post('/api/comment/update',{id:c.id,fields:{suggest:false}});S.comments=r.comments;renderQueue();markAnchors();renderDecisions();
    toast('Added as a change — it goes with Send')});
  root.querySelectorAll('[data-nothanks]').forEach(b=>b.onclick=async()=>{const r=await post('/api/comment/update',{id:b.dataset.nothanks,fields:{suggest:false}});
    S.comments=r.comments;renderQueue()});
  root.querySelectorAll('[data-wide]').forEach(b=>b.onclick=()=>{WIDE=b.dataset.wide;renderWide()});
}
// The wide view of one thread (⤢): redrawn on every refresh, so answers and your own replies appear in it.
let WIDE=null; const DRAFT={};
function renderWide(){const w=$('#wideview');if(!w)return;
  const c=WIDE&&S.comments.find(x=>x.id===WIDE);
  if(!c){w.classList.remove('on');w.innerHTML='';return}
  const inp=w.querySelector('[data-rin]'), typing=inp&&document.activeElement===inp, pos=inp?inp.selectionStart:0;
  if(inp&&inp.value)DRAFT[WIDE]=inp.value;
  const sc=w.scrollTop, atBottom=w.scrollHeight-w.scrollTop-w.clientHeight<40;
  w.innerHTML='<button class="x" title="Close">×</button>'+item(c,true);w.classList.add('on');
  w.querySelector('.x').onclick=()=>{WIDE=null;renderWide()};
  wireThread(w);
  const ni=w.querySelector('[data-rin]');
  if(ni&&DRAFT[WIDE]!=null){ni.value=DRAFT[WIDE]}
  if(ni&&typing){ni.focus();try{ni.setSelectionRange(pos,pos)}catch(e){}}
  w.scrollTop=atBottom?w.scrollHeight:sc}
// Tell the App Maker (when this page is inside it) the round and counts it shows in its own header.
function report(){try{if(window.top===window)return;const gs=groups();
  const done=gs.filter(g=>g.querySelector('input:checked')).length;
  window.parent.postMessage({type:'am-page',title:(document.querySelector('header h1')||{}).textContent||document.title,
    round:ROUND,decided:done,total:gs.length,queued:S.comments.filter(c=>c.status==='queued').length,
    waiting:S.comments.filter(waiting).length,
    // the same statuses as the Chat center: queued → sent → working → done (user, 2026-10-08)
    sent:S.comments.filter(c=>stateOf(c)[0]==='wait').length, working:S.comments.filter(c=>stateOf(c)[0]==='work').length,
    call:S.comments.filter(c=>stateOf(c)[0]==='call').length},'*')}catch(e){}}
function markAnchors(){
  document.querySelectorAll('[data-anchor]').forEach(el=>{
    const has=S.comments.some(c=>c.anchor===el.dataset.anchor&&c.status==='queued');
    const b=el.querySelector(':scope > .cbtn');
    if(b){b.classList.toggle('has',has); b.textContent=has?'commented':'comment'}});
}
const PH={change:'What is wrong, missing, or should change here? Waits for Send.',
          question:'What do you want to know? Answered right here, in the panel.',
          note:'A thought, context or reaction. Waits for Send; the page only changes if you ask.'};
const kind=()=>$('#pop input[name=kind]:checked').value;
function setKind(k){$(`#pop input[name=kind][value="${k}"]`).checked=true;
  document.querySelectorAll('#pop .kind label').forEach(l=>l.classList.toggle('sel',l.querySelector('input').value===k));
  $('#poptext').placeholder=PH[k]; $('#popadd').textContent=k==='question'?'Send now':'Add to queue'}
let target=null;
document.addEventListener('click',e=>{
  const btn=e.target.closest('.cbtn');
  if(!btn){ if(!e.target.closest('#pop')&&!e.target.closest('#pagec')) $('#pop').style.display='none'; return }
  const el=btn.closest('[data-anchor]');
  target={anchor:el.dataset.anchor,label:el.dataset.label,
          text:(el.querySelector('h2,.q')||{}).textContent||''};

  p.style.display='block'; p.style.top=(window.scrollY+r.bottom+8)+'px';

  $('#poptext').focus();
});
$('#poptext').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#popadd').click()}};
$('#popcancel').onclick=()=>$('#pop').style.display='none';
$('#popadd').onclick=async()=>{
  const t=$('#poptext').value.trim(); if(!t||!target)return;
  const k=kind(), now=k==='question';
  const r=await post('/api/comment',{id:'c'+Date.now(),anchor:target.anchor,
    anchorLabel:target.label,anchorText:target.text,text:t,kind:k,now});
  S.comments=r.comments; $('#pop').style.display='none';
  renderQueue(); markAnchors(); renderDecisions(); toast(now?(AGENT.agent?'Sent to '+AGENT.agent:'Sent'):'Queued — goes with Send')};

// ---- "Claude is working" indicator ----
// After a send, poll until the page file changes (Claude rebuilt it) or every comment in that
// round is marked addressed. Survives a reload (localStorage), so a page that reloads itself
// after sending (e.g. a stage gate) still shows it.
const WK='working:'+location.pathname;
const lastMod=()=>fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(r=>r.headers.get('Last-Modified')||'').catch(()=>'');
// The round's status is one small line in the Chat center (the old bar above the page pushed it around).
function wset(cls,text){const w=$('#wstat');if(!w)return;const k=cls||'working';
  const msg={working:'Round sent — Claude is working on it',ready:'Page updated',stale:'Still waiting — if nothing comes, say “sent” in the terminal'}[k]||'';
  w.className='wstat '+k;w.innerHTML=(k==='working'?'<span class="spin"></span>':k==='ready'?'✓ ':'')+msg+(k==='ready'?' <button id="wreload2">Reload</button>':'');
  const b=document.getElementById('wreload2');if(b)b.onclick=()=>location.reload()}
async function markWorking(round){const lm=await lastMod();
  try{localStorage.setItem(WK,JSON.stringify({round,lm,t:Date.now()}))}catch(e){}
  wset('',`<b>Claude is working on round ${round}…</b> Your comments and decisions are sent. This bar changes when the revision is ready.`);pollWorking()}
window.markWorking=markWorking;
let wtimer=null;
function pollWorking(){clearTimeout(wtimer);let w;try{w=JSON.parse(localStorage.getItem(WK)||'null')}catch(e){w=null}
  if(!w)return;
  wtimer=setTimeout(async()=>{const lm=await lastMod();
    const st=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
    // this round's comments only: the batch records their ids
    const b=st?(st.batches||[])[w.round-1]:null;const ids=new Set((b&&b.commentIds)||[]);
    const mine=st?(st.comments||[]).filter(c=>ids.has(c.id)):[];
    const allDone=(b&&b.addressed)||(mine.length>0&&mine.every(c=>c.addressed));
    if((lm&&w.lm&&lm!==w.lm)||allDone){try{localStorage.removeItem(WK)}catch(e){};setTimeout(renderProgress,0)
      wset('ready',`<b>Round ${w.round} revision is ready.</b> Reload to see what changed — it's listed at the top of the left rail.`);return}
    if(Date.now()-w.t>4*60*1000){wset('stale',`<b>Still waiting on round ${w.round}.</b> If nothing arrives, type “sent” in the terminal — the automatic wake-up may have missed it.`)}
    pollWorking()},4000)}
$('#wreload').onclick=()=>location.reload();
// Discard: close the review and throw it away (user, 2026-09-30). The server moves the folder to the
// Trash, tells Claude, and stops. Not offered inside the App Maker, whose header is hidden anyway.
(()=>{const h=document.querySelector('header'); if(!h||document.documentElement.classList.contains('embedded'))return;
  const b=document.createElement('button'); b.className='theme danger'; b.textContent='Discard'; b.title='Close this review and move it to the Trash';
  const ask=document.createElement('span'); ask.className='discardask'; ask.hidden=true;
  ask.innerHTML='Move this review to the Trash and stop it? <button class="yes">Discard</button><button class="no">Cancel</button>';
  b.onclick=()=>{b.hidden=true; ask.hidden=false};
  ask.querySelector('.no').onclick=()=>{ask.hidden=true; b.hidden=false};
  ask.querySelector('.yes').onclick=async()=>{
    try{await fetch('/api/discard',{method:'POST',body:'{}'})}catch(e){}
    document.body.innerHTML='<div class="discarded"><h1>Review discarded</h1><p>It\'s in the Trash if you need it back. You can close this tab.</p></div>'};
  h.insertBefore(ask,h.querySelector('#dcount').nextSibling); h.insertBefore(b,ask)})();

$('#send').onclick=async()=>{
  const r=await post('/api/send',{});
  S.comments.forEach(c=>{if(c.status==='queued')c.status='sent'});
  S.batches.push({decisions:{...S.decisions}});
  ROUND+=1; $('#round').textContent=`Round ${ROUND}`;
  renderQueue(); markAnchors(); renderDecisions();
  toast(`Round ${ROUND-1} sent — ${r.sent} comment${r.sent===1?'':'s'} + decisions`);
  markWorking(ROUND-1)};
document.addEventListener('change',async e=>{
  const i=e.target;
  if(i.closest('#pop')){ if(i.name==='kind') setKind(i.value); return }
  if(i.type==='radio'){S.decisions[i.name]=i.value; await post('/api/decision',{id:i.name,value:i.value})}
  else if(i.type==='checkbox'){
    const v=[...document.querySelectorAll(`input[name="${i.name}"]:checked`)].map(x=>x.value);
    S.decisions[i.name]=v; await post('/api/decision',{id:i.name,value:v})}
  else return;
  document.querySelectorAll('label.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));
  renderDecisions(); renderQueue(); toast('Saved')});
// Clicking the chosen radio again clears it (user, 2026-09-30: "how to unselect").
let wasOn=null;
document.addEventListener('pointerdown',e=>{
  const i=e.target.closest('label.opt')?.querySelector('input[type=radio]'); wasOn=i&&i.checked?i:null},true);
document.addEventListener('click',e=>{
  const i=e.target.closest('label.opt')?.querySelector('input[type=radio]');
  if(!i||i!==wasOn)return;
  e.preventDefault(); wasOn=null;
  setTimeout(async()=>{
    i.checked=false; delete S.decisions[i.name];
    await post('/api/decision',{id:i.name,value:null});
    document.querySelectorAll('label.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));
    renderDecisions(); renderQueue(); toast('Cleared')},0)});
// Resizable side columns: a grip in each gap. Drag to resize, double-click to reset.
(()=>{const L=document.querySelector('.layout'), toc=$('#toc'), chat=document.querySelector('aside.right');
  if(!L||!toc||!chat)return;
  const CK='hw-cols', DEF={tocw:206,chatw:350}, LIM={tocw:[120,420],chatw:[260,720]};
  let W={}; try{W=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}
  const apply=()=>{for(const k in DEF)W[k]?L.style.setProperty('--'+k,W[k]+'px'):L.style.removeProperty('--'+k)};
  const grips={tocw:document.createElement('div'),chatw:document.createElement('div')};
  for(const [k,g] of Object.entries(grips)){g.className='colgrip'; g.title='Drag to resize · double-click to reset'; L.appendChild(g);
    g.ondblclick=()=>{delete W[k]; apply(); save(); place()};
    g.onpointerdown=e=>{e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag');
      document.documentElement.classList.add('colresize');
      const x0=e.clientX, w0=(k==='tocw'?toc:chat).getBoundingClientRect().width, main=L.querySelector('main').getBoundingClientRect().width;
      g.onpointermove=m=>{const dx=m.clientX-x0, [lo,hi]=LIM[k];
        let w=k==='tocw'?w0+dx:w0-dx; w=Math.max(lo,Math.min(hi,w,w0+main-360)); W[k]=Math.round(w); apply(); place(); save()};
      // saved on every move: letting go outside this frame (e.g. over the Ideation navbar) never sends pointerup here
      g.onpointerup=g.onlostpointercapture=()=>{g.onpointermove=g.onpointerup=g.onlostpointercapture=null; g.classList.remove('drag');
        document.documentElement.classList.remove('colresize'); save()}}}
  function save(){try{localStorage.setItem(CK,JSON.stringify(W))}catch(e){}}
  function place(){const lb=L.getBoundingClientRect(), shown=el=>getComputedStyle(el).display!=='none'&&getComputedStyle(el).position!=='fixed';
    const t=toc.getBoundingClientRect(), c=chat.getBoundingClientRect(), m=L.querySelector('main').getBoundingClientRect();
    grips.tocw.hidden=!shown(toc); grips.tocw.style.left=((t.right+m.left)/2-lb.left-7)+'px';
    grips.chatw.hidden=!shown(chat); grips.chatw.style.left=((m.right+c.left)/2-lb.left-7)+'px'}
  apply(); place(); addEventListener('resize',place); new ResizeObserver(place).observe(L)})();

// Phones: tables with a header row turn into stacked cards; each cell gets its column name (user, 2026-10-08)
(()=>{document.querySelectorAll('table.t').forEach(t=>{const head=[...(t.querySelector('tr')||{children:[]}).children];
  if(!head.length||head[0].tagName!=='TH')return; t.classList.add('stack');
  const names=head.map(th=>th.textContent.trim());
  t.querySelectorAll('tr').forEach(tr=>{if(tr===head[0].parentElement||tr.classList.contains('grp'))return;
    [...tr.children].forEach((td,i)=>{if(i>0&&names[i]&&!td.dataset.th)td.dataset.th=names[i]})})})})();

async function refresh(){try{
  const [st,ag]=await Promise.all([fetch('/api/state',{cache:'no-store'}).then(r=>r.json()),fetch('/api/agent',{cache:'no-store'}).then(r=>r.json()).catch(()=>({}))]);
  AGENT=ag||{}; const before=JSON.stringify(S.comments); S.comments=st.comments||[]; S.batches=st.batches||[]; S.base=st.baseline||{};
  if(JSON.stringify(S.comments)!==before||true)renderQueue();}catch(e){}}
// every 6 s; every 2.5 s while Claude owes an answer
function owed(){return S.comments.some(c=>c.status==='sent'&&!c.addressed&&(c.kind==='question'||c.kind==='note'||(c.messages||[]).length))}
let rtimer=null;
function refreshSoon(){clearTimeout(rtimer);rtimer=setTimeout(async()=>{await refresh();refreshSoon()},owed()?2500:6000)}
refreshSoon();
fetch('/api/agent').then(r=>r.json()).then(a=>{AGENT=a||{};renderQueue()}).catch(()=>{});
fetch('/api/state').then(r=>r.json()).then(async st=>{
  S.decisions=st.decisions||{}; S.comments=st.comments||[]; S.batches=st.batches||[]; S.base=st.baseline||{}; PLOADED=true;
  ROUND=S.batches.length+1; $('#round').textContent=`Round ${ROUND}`;
  for(const [k,v] of Object.entries(S.decisions))
    (Array.isArray(v)?v:[v]).forEach(val=>{
      // escaped: a text answer (e.g. a description with a line break) is not a valid selector and used to
      // stop the whole restore, so no ticks came back (user, 2026-10-06)
      if(typeof val!=='string'||val.length>200)return;
      const i=document.querySelector(`input[name="${CSS.escape(k)}"][value="${CSS.escape(val)}"]`); if(i)i.checked=true});
  document.querySelectorAll('label.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));
  post('/api/groups',{groups:groups().map(g=>g.dataset.radio||g.dataset.check)});
  buildToc(); buildChanged(); renderQueue(); markAnchors(); renderDecisions();
  pollWorking();  // a round sent before a reload keeps its "working" bar
  if(window.mermaid){mermaid.initialize({startOnLoad:false,
    theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'neutral',securityLevel:'loose'});
    try{await mermaid.run({nodes:[...document.querySelectorAll('pre.mermaid')]})}catch(e){}}
});
